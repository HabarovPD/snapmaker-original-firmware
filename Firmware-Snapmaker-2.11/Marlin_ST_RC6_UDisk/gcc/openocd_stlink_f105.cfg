# ST-Link V2 (incl. Chinese clones) + STM32F105RC / GD32F105RC over SWD.
#
# Wiring (board SWD header -> ST-Link): SWDIO, SWCLK, GND, and 3.3V only as a
# voltage reference - power the board from its own supply.

source [find interface/stlink.cfg]
transport select hla_swd

# GD32 clones report a different CPUTAPID; 0 = accept any
set CPUTAPID 0
set FLASH_SIZE 0x40000

source [find target/stm32f1x.cfg]

adapter speed 1000

# Connect-under-reset (if the chip does not answer): wire ST-Link RST -> NRST
# and run make with OOCD_EXTRA='-c "reset_config srst_only srst_nogate connect_assert_srst"'
